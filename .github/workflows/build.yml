name: Build CarneliaVPN

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" >/dev/null

      - name: Decode release keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build CarneliaWallet release APK
        working-directory: android
        run: ./gradlew assembleCarneliaWalletRelease --stacktrace

      - name: Extract version
        id: ver
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts | head -1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "Building version $VERSION"

      - name: Rename APKs
        run: |
          V=${{ steps.ver.outputs.version }}
          cp android/app/build/outputs/apk/carneliaWallet/release/app-carnelia-wallet-arm64-v8a-release.apk \
             CarneliaVPN-${V}-arm64.apk
          cp android/app/build/outputs/apk/carneliaWallet/release/app-carnelia-wallet-universal-release.apk \
             CarneliaVPN-${V}-universal.apk

      - name: Upload arm64 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarneliaVPN-arm64
          path: CarneliaVPN-*-arm64.apk

      - name: Upload universal APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarneliaVPN-universal
          path: CarneliaVPN-*-universal.apk

      - name: Publish to carnelia-update release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # Create release if it doesn't exist yet
          gh release view "$TAG" --repo voksed/carnelia-update 2>/dev/null || \
            gh release create "$TAG" \
              --repo voksed/carnelia-update \
              --title "CarneliaVPN $VERSION" \
              --notes "CarneliaVPN $VERSION" \
              --latest

          # Upload/replace APKs
          gh release upload "$TAG" \
            CarneliaVPN-${VERSION}-arm64.apk \
            CarneliaVPN-${VERSION}-universal.apk \
            --repo voksed/carnelia-update \
            --clobber

  desktop:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 + Qt6
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-json-glib
          update: false

      - name: Configure CMake
        shell: msys2 {0}
        run: cmake -B build-ci -S desktop -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Build
        shell: msys2 {0}
        run: cmake --build build-ci --config Release

      - name: Upload desktop EXE
        uses: actions/upload-artifact@v4
        with:
          name: CarneliaVPN-windows-x64
          path: build-ci/CarneliaVPN.exe
