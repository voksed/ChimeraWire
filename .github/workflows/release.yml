name: Build & Release APK

# Публикация новой версии: поставь тег vX.Y.Z и запушь его —
#   git tag v3.0.1 && git push origin v3.0.1
# CI соберёт подписанные APK и создаст GitHub Release. Приложение подхватит его само.
on:
  push:
    tags: ['v*']
  workflow_dispatch:            # можно запустить вручную из вкладки Actions

permissions:
  contents: write               # нужно, чтобы создать Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Восстановить keystore из секрета
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks

      - name: Собрать подписанный release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Переименовать APK под версию
        run: |
          V="${GITHUB_REF_NAME}"
          OUT=android/app/build/outputs/apk/release
          mkdir -p dist
          cp "$OUT/app-arm64-v8a-release.apk" "dist/carnelia-vpn-${V}-arm64.apk"
          cp "$OUT/app-x86_64-release.apk"    "dist/carnelia-vpn-${V}-x86_64.apk"
          cp "$OUT/app-universal-release.apk" "dist/carnelia-vpn-${V}-universal.apk"

      - name: Создать GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
